apiVersion: 1

providers:
  # Single provider scanning the whole mounted dashboards directory. The
  # previous configuration also declared per-folder providers pointing at
  # /etc/grafana/provisioning/dashboards/{system,application,infrastructure,
  # alerting} — directories that do not exist in this deployment, so Grafana
  # logged provisioning errors on every 10s refresh.
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
